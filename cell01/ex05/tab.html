<!DOCTYPE html>
<html>
<head>
    <title>Tab</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            height: 100px;
            border: 1px solid black;
        }

        .first-cell {
            background-color: lightgreen;
        }

        .second-cell {
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
