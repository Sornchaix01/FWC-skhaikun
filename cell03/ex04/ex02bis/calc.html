<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>

    <link rel="stylesheet" href="calc.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <div class="calculator">

        <input type="number" id="leftNumber" min="0">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="number" id="rightNumber" min="0">

        <button id="calculateButton">Try me!</button>

    </div>

    <script src="calc.js"></script>
</body>
</html>
